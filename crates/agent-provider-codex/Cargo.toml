[package]
name = "agent-provider-codex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Codex agent provider adapter and Codex-owned storage for CodeWide Companion"

[dependencies]
agent-core = { path = "../agent-core" }
agent-resources = { path = "../agent-resources" }
agent-search = { path = "../agent-search" }
agent-transport = { path = "../agent-transport" }
companion-host = { path = "../companion-host" }
async-trait = "0.1.89"
base64 = "0.22.1"
blake3 = "1.8.2"
futures-util = "0.3.31"
hex = "0.4.3"
memchr = "2.7.5"
notify = "8.2.0"
percent-encoding = "2.3.1"
rand = "0.9.2"
redb = { version = "4.1.0", features = ["cache_metrics"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.21.0"

[lints]
workspace = true
