[package]
name = "agent-provider-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Claude agent provider adapter for CodeWide Companion: supervises the Claude host over stdio"

[dependencies]
agent-core = { path = "../agent-core" }
agent-resources = { path = "../agent-resources" }
agent-search = { path = "../agent-search" }
agent-transport = { path = "../agent-transport" }
companion-host = { path = "../companion-host" }
async-trait = "0.1.89"
base64 = "0.22.1"
flate2 = "1.1.10"
notify = "8.2.0"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls-native-roots"] }
redb = { version = "4.1.0", features = ["cache_metrics"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tar = "0.4.44"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"

[dev-dependencies]

[lints]
workspace = true
