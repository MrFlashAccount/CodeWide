[package]
name = "agent-provider-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Claude agent provider adapter for CodeWide Companion: drives the claude CLI over stream-json"

[dependencies]
agent-core = { path = "../agent-core" }
agent-resources = { path = "../agent-resources" }
agent-search = { path = "../agent-search" }
companion-host = { path = "../companion-host" }
async-trait = "0.1.89"
base64 = "0.22.1"
libc = "0.2.175"
notify = "8.2.0"
rand = "0.9.2"
redb = { version = "4.1.0", features = ["cache_metrics"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["test-util"] }

[lints]
workspace = true
