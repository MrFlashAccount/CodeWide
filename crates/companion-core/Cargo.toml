[package]
name = "companion-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared CodeWide Companion runtime and domain owners"

[features]
default = []
e2e-command-fault = []

[dependencies]
codewide-relay = { path = "../../apps/relay" }
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.22.1"
blake3 = "1.8.2"
bytes = "1.10.1"
clap = { version = "4.5.45", features = ["derive"] }
fs2 = "0.4.3"
futures-util = "0.3.31"
http = "1.3.1"
hex = "0.4.3"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jsonschema = { version = "0.52.0", default-features = false }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "crypto-rust", "linux-native-sync-persistent", "vendored", "windows-native"] }
libc = "0.2.175"
memchr = "2.7.5"
mime_guess = "2.0.5"
notify = "8.2.0"
opus-pure = "0.2.1"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
percent-encoding = "2.3.1"
portable-pty = "0.9.0"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.9.2"
rcgen = "0.14.9"
redb = { version = "4.1.0", features = ["cache_metrics"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.9"
tempfile = "3.21.0"
thiserror = "2.0.16"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.29.0"
tokio-util = { version = "0.7.16", features = ["io", "rt"] }
tower-service = "0.3.3"
tower-layer = "0.3.3"
tower-http = { version = "0.6.11", features = ["compression-gzip"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
walkdir = "2.5.0"
webp = { version = "0.3.1", default-features = false }
url = "2.5.7"
x509-parser = "0.18.1"

[dev-dependencies]
flate2 = "1.1.10"
quircs = "0.10.3"

[build-dependencies]
serde_json = "1.0.143"

[lints]
workspace = true
