[package]
name = "codewide-host-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Signed release admission and crash-safe Linux generation updates for CodeWide hosts"

[features]
default = []
# Linux preparation plus the network-dark activation guardian: durable journal,
# immutable generations, atomic activation, health proof and rollback.
linux-guardian = ["dep:codewide-host-resolver", "dep:fs2", "dep:futures-util", "dep:libc", "dep:rand", "dep:reqwest", "dep:rustix", "dep:tokio", "dep:tracing", "dep:walkdir"]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
hex = "0.4.3"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
codewide-host-resolver = { path = "../host-resolver", optional = true }
fs2 = { version = "0.4.3", optional = true }
futures-util = { version = "0.3.31", optional = true }
libc = { version = "0.2.175", optional = true }
rand = { version = "0.9.2", optional = true }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"], optional = true }
rustix = { version = "1.1.4", features = ["fs"], optional = true }
tokio = { version = "1.47.1", features = ["process", "rt-multi-thread", "sync", "time"], optional = true }
tracing = { version = "0.1.41", optional = true }
walkdir = { version = "2.5.0", optional = true }

[dev-dependencies]
flate2 = "1.1.10"
tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
