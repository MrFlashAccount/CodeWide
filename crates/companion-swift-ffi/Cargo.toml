[package]
name = "companion-swift-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Narrow UniFFI adapter between the Swift host and Companion core"

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
async-trait = "0.1.89"
companion-core = { path = "../companion-core" }
rand = "0.9.2"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["process", "rt-multi-thread", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uniffi = { version = "0.32.1", features = ["cli"] }

[dev-dependencies]
tempfile = "3.21.0"

[lints]
workspace = true
