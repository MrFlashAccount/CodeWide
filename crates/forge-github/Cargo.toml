[package]
name = "forge-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Built-in GitHub forge plugin for the CodeWide companion"

[[bin]]
name = "codewide-forge-github"
path = "src/main.rs"

[dependencies]
forge-protocol = { path = "../forge-protocol" }
async-trait = "0.1.89"
base64 = "0.22.1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "io-std", "macros", "process", "rt-multi-thread", "sync", "time", "fs"] }
time = { version = "0.3.47", features = ["formatting", "parsing"] }
url = "2.5.7"

[dev-dependencies]
axum = { version = "0.8.4" }
tempfile = "3.21.0"

[lints]
workspace = true
