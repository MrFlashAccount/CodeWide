# Drop-in for codewide-companion.service, installed by
# install-claude-provider.sh when the Claude provider is enabled
# (~/.config/systemd/user/codewide-companion.service.d/claude-provider.conf).
#
# The Claude agent host, the user's `claude` and every command Claude's Bash
# tool runs are children of the companion and inherit this unit's sandbox
# (Codex tools run under the separate Codex app-server instead). Only the
# properties proven to break Claude are relaxed; everything else in the unit
# stays. Evidence (systemd 255, transient units with the unit's hardening):
#
# RestrictAddressFamilies: AF_NETLINK is added. Without it, Node's
#   os.networkInterfaces() (libuv getifaddrs) fails with EAFNOSUPPORT
#   ("uv_interface_addresses returned Unknown system error 97"), and
#   bubblewrap --unshare-net cannot configure loopback ("Failed to create
#   NETLINK_ROUTE socket"). Allow-lists merge, so this line adds one family.
#
# RestrictNamespaces: the namespaces bubblewrap creates are allowed. With
#   RestrictNamespaces=true, Claude Code's sandboxed Bash (bubblewrap) fails
#   with "No permissions to create new namespace". Lists merge by OR with the
#   unit's `true`, so exactly these types become available; `time` stays
#   restricted.
#
# Not relaxed: ProtectSystem=full (keeps /usr, /boot and /etc read-only, so a
#   `claude` installed under /usr cannot update itself while CodeWide runs it;
#   update it from a shell), NoNewPrivileges (no sudo from Claude's tools),
#   CapabilityBoundingSet= (bubblewrap uses unprivileged user namespaces).
[Service]
RestrictAddressFamilies=AF_NETLINK
RestrictNamespaces=user mnt pid net ipc uts cgroup
