[package]
name = "codewide-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.22.1"
clap = { version = "4.5.45", features = ["derive"] }
futures-util = "0.3.31"
fs2 = "0.4.3"
blake3 = "1.8.2"
hex = "0.4.3"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["service", "tokio"] }
rand = "0.9.2"
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.16", features = ["rt"] }

[dev-dependencies]
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.21.0"

[build-dependencies]
serde_json = "1.0.143"

[lints]
workspace = true
