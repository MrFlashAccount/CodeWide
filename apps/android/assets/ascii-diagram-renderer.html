<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <style>
    @font-face { font-family: CodeWideDiagramMono; src: url('fonts/JetBrainsMonoNerdFontMono-Regular.ttf') format('truetype'); font-style: normal; font-weight: 400; font-display: block; }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #171b20; color: #eef2f6; overflow: hidden; overscroll-behavior: none; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #root[data-mode="inline"] { height: auto; min-height: 1px; padding: 10px; }
    #root[data-mode="inline"] #stage, #root[data-mode="inline"] #canvas { width: 100%; height: auto; }
    #root[data-mode="inline"] #canvas svg { display: block; width: 100%; max-width: none; height: auto; }
    #root[data-mode="fullscreen"] { touch-action: none; }
    #root[data-mode="fullscreen"] #stage { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); place-items: center; overflow: hidden; touch-action: none; }
    #root[data-mode="fullscreen"] #canvas { flex: 0 0 auto; touch-action: none; will-change: transform; transform-origin: 50% 50%; }
    #root[data-mode="fullscreen"] #canvas svg { display: block; width: 100%; height: 100%; max-width: none; }
  </style>
  <script src="panzoom.min.js"></script>
  <script src="svgbob-wasm.js"></script>
</head>
<body><main id="root"><div id="stage"><div id="canvas"></div></div></main>
<script>
  const root = document.getElementById('root');
  const canvas = document.getElementById('canvas');
  let panzoom = null;
  let scale = 1;
  let fitScale = 1;
  let naturalWidth = 1;
  let naturalHeight = 1;
  let currentMode = 'inline';
  let currentRequestId = -1;
  let resizeFrame = null;

  function send(message) {
    window.ReactNativeWebView.postMessage(JSON.stringify(message));
  }

  function reportSize(requestId, height) {
    requestAnimationFrame(function () {
      send({ type: 'rendered', requestId, height: Math.ceil(height), width: Math.ceil(root.clientWidth), scale });
    });
  }

  function destroyPanzoom() {
    if (panzoom !== null) panzoom.destroy();
    panzoom = null;
    canvas.style.removeProperty('transform');
    canvas.style.removeProperty('cursor');
  }

  window.diagramZoom = function (factor, requestId) {
    if (panzoom === null) return;
    const next = Math.max(.15, Math.min(8, panzoom.getScale() * factor));
    panzoom.zoom(next, { animate: false });
    scale = panzoom.getScale();
    reportSize(requestId, innerHeight);
  };

  window.diagramReset = function (requestId) {
    if (panzoom === null) return;
    panzoom.zoom(fitScale, { animate: false, force: true });
    panzoom.pan(0, 0, { animate: false, force: true });
    scale = panzoom.getScale();
    reportSize(requestId, innerHeight);
  };

  window.diagramSetAnnotationMode = function () {};
  window.diagramAddReviewPoint = function () {};

  function viewBoxSize(svg) {
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width > 0 && viewBox.height > 0) return { width: viewBox.width, height: viewBox.height };
    const width = Number.parseFloat(svg.getAttribute('width') || '0');
    const height = Number.parseFloat(svg.getAttribute('height') || '0');
    if (width > 0 && height > 0) {
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      return { width, height };
    }
    const bounds = svg.getBBox();
    return { width: Math.max(1, bounds.width), height: Math.max(1, bounds.height) };
  }

  function themeSvg(svg) {
    svg.classList.add('svgbob');
    for (const element of svg.querySelectorAll('script, foreignObject, iframe, object, embed, image, use')) element.remove();
    for (const element of svg.querySelectorAll('*')) {
      for (const attribute of [...element.attributes]) {
        if (attribute.name.toLowerCase().startsWith('on') || attribute.name === 'href' || attribute.name === 'xlink:href') element.removeAttribute(attribute.name);
      }
    }
    const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    style.textContent = `
      .svgbob { background: transparent; }
      .svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon { stroke: #9aa7b4; }
      .svgbob text { fill: #eef2f6; font-family: CodeWideDiagramMono, monospace; font-size: 13.333px; white-space: pre; }
      .svgbob rect.backdrop { fill: transparent; stroke: none; }
      .svgbob .filled { fill: #9aa7b4; }
      .svgbob .bg_filled, .svgbob .nofill { fill: #171b20; }
    `;
    svg.appendChild(style);
  }

  function utf8Width(character) {
    const codePoint = character.codePointAt(0) || 0;
    if (codePoint <= 0x7f) return 1;
    if (codePoint <= 0x7ff) return 2;
    if (codePoint <= 0xffff) return 3;
    return 4;
  }

  // Svgbob uses UTF-8 byte length while merging CellText. Cyrillic labels are
  // therefore emitted as overlapping even/odd text fragments. Reassemble only
  // overlapping non-ASCII fragments; quoted/verbatim and Latin labels are left
  // exactly as the engine produced them.
  function repairUnicodeText(svg) {
    const fragments = [...svg.querySelectorAll('text')]
      .map(function (element) {
        const x = Number.parseFloat(element.getAttribute('x') || 'NaN');
        const y = Number.parseFloat(element.getAttribute('y') || 'NaN');
        const content = element.textContent || '';
        return { element, x, y, content };
      })
      .filter(function (fragment) { return Number.isFinite(fragment.x) && Number.isFinite(fragment.y) && /[^\u0000-\u007f]/u.test(fragment.content); });
    const parent = fragments.map(function (_, index) { return index; });
    function find(index) {
      if (parent[index] !== index) parent[index] = find(parent[index]);
      return parent[index];
    }
    function unite(left, right) {
      const leftRoot = find(left);
      const rightRoot = find(right);
      if (leftRoot !== rightRoot) parent[rightRoot] = leftRoot;
    }
    function endX(fragment) {
      return fragment.x + [...fragment.content].reduce(function (width, character) { return width + utf8Width(character) * 8; }, 0);
    }
    for (let left = 0; left < fragments.length; left += 1) {
      for (let right = left + 1; right < fragments.length; right += 1) {
        if (fragments[left].y !== fragments[right].y) continue;
        if (fragments[left].x < endX(fragments[right]) && fragments[right].x < endX(fragments[left])) unite(left, right);
      }
    }
    const groups = new Map();
    fragments.forEach(function (fragment, index) {
      const root = find(index);
      const group = groups.get(root) || [];
      group.push(fragment);
      groups.set(root, group);
    });
    for (const group of groups.values()) {
      if (group.length < 2) continue;
      const cells = new Map();
      for (const fragment of group) {
        let x = fragment.x;
        for (const character of [...fragment.content]) {
          cells.set(x, character);
          x += utf8Width(character) * 8;
        }
      }
      const occupied = [...cells.entries()].sort(function (left, right) { return left[0] - right[0]; });
      const ordered = [];
      for (let x = occupied[0][0]; x <= occupied[occupied.length - 1][0]; x += 8) ordered.push([x, cells.get(x) || ' ']);
      const leftmost = group.reduce(function (current, fragment) { return fragment.x < current.x ? fragment : current; });
      leftmost.element.setAttribute('x', ordered.map(function (entry) { return entry[0]; }).join(' '));
      leftmost.element.textContent = ordered.map(function (entry) { return entry[1]; }).join('');
      for (const fragment of group) if (fragment !== leftmost) fragment.element.remove();
    }
  }

  function layoutInline(svg, requestId) {
    destroyPanzoom();
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    const size = viewBoxSize(svg);
    const availableWidth = Math.max(1, root.clientWidth - 20);
    reportSize(requestId, availableWidth * size.height / size.width + 20);
  }

  function fullscreenFitScale() {
    const horizontalGutter = Math.min(160, Math.max(48, innerWidth * .14));
    const verticalGutter = Math.min(180, Math.max(72, innerHeight * .16));
    return Math.min(1, Math.max(.15, (innerWidth - horizontalGutter * 2) / naturalWidth), Math.max(.15, (innerHeight - verticalGutter * 2) / naturalHeight));
  }

  function layoutFullscreen(svg, requestId) {
    destroyPanzoom();
    const size = viewBoxSize(svg);
    naturalWidth = Math.max(1, Math.ceil(size.width));
    naturalHeight = Math.max(1, Math.ceil(size.height));
    canvas.style.width = naturalWidth + 'px';
    canvas.style.height = naturalHeight + 'px';
    fitScale = fullscreenFitScale();
    panzoom = Panzoom(canvas, { canvas: true, cursor: 'move', minScale: .15, maxScale: 8, startScale: fitScale, step: .2, touchAction: 'none' });
    panzoom.pan(0, 0, { force: true });
    scale = panzoom.getScale();
    reportSize(requestId, innerHeight);
  }

  window.addEventListener('resize', function () {
    if (currentMode !== 'fullscreen' || panzoom === null) return;
    if (resizeFrame !== null) cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(function () {
      resizeFrame = null;
      const svg = canvas.querySelector('svg');
      if (svg) layoutFullscreen(svg, currentRequestId);
    });
  });

  window.renderAsciiDiagram = async function (source, requestId, mode) {
    currentRequestId = requestId;
    currentMode = mode === 'fullscreen' ? 'fullscreen' : 'inline';
    root.dataset.mode = currentMode;
    try {
      const svgSource = await window.renderSvgbob(source);
      const parsed = new DOMParser().parseFromString(svgSource, 'image/svg+xml');
      if (parsed.querySelector('parsererror')) throw new Error('Svgbob returned invalid SVG');
      const svg = parsed.documentElement;
      if (svg.localName !== 'svg') throw new Error('Svgbob returned no SVG');
      repairUnicodeText(svg);
      themeSvg(svg);
      canvas.replaceChildren(document.importNode(svg, true));
      const rendered = canvas.querySelector('svg');
      if (!rendered) throw new Error('Svgbob returned no SVG');
      if (currentMode === 'fullscreen') layoutFullscreen(rendered, requestId);
      else layoutInline(rendered, requestId);
    } catch (error) {
      send({ type: 'error', requestId, message: error instanceof Error ? error.message : String(error) });
    }
  };

  send({ type: 'ready' });
</script>
</body>
</html>
