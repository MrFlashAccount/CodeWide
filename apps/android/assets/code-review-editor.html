<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <style>
      :root {
        color-scheme: dark;
        --review-canvas: #0b0c0e;
        --review-panel: #101113;
        --review-panel-raised: #181a1e;
        --review-panel-soft: #1e2126;
        --review-border: rgba(255,255,255,.075);
        --review-border-strong: rgba(255,255,255,.12);
        --review-text: #f1f3f5;
        --review-muted: #8d939c;
        --review-dim: #686e77;
        --review-accent: #78a9ff;
        --review-accent-soft: rgba(120,169,255,.14);
        --review-green: #55c58a;
        --review-red: #f0757b;
        --review-shadow: none;
      }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--review-canvas); }
      * { box-sizing: border-box; }
      button, textarea, input { font: inherit; }
      #workspace { width: 100%; height: 100%; display: flex; gap: 0; padding: 10px; overflow: hidden; background: var(--review-canvas); }
      .review-panel { min-height: 0; overflow: hidden; border: 1px solid var(--review-border-strong); background: var(--review-panel); box-shadow: var(--review-shadow); }
      #tree-panel { width: 37%; min-width: 300px; max-width: 460px; display: flex; flex-direction: column; border-right: 0; border-radius: 16px 0 0 16px; }
      #tree {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        padding-top: 10px;
        background: var(--review-panel);
        color-scheme: dark;
      }
      #preview-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; border-radius: 0 16px 16px 0; }
      #preview { flex: 1; min-width: 0; min-height: 0; overflow: auto; overscroll-behavior: contain; touch-action: pan-x pan-y; background: #0e0f11; scrollbar-color: rgba(255,255,255,.17) transparent; }
      .pierre-preview-host { min-width: 100%; min-height: 100%; }
      #preview::-webkit-scrollbar { width: 8px; height: 8px; }
      #preview::-webkit-scrollbar-track { background: transparent; }
      #preview::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 999px; background: rgba(255,255,255,.18); background-clip: content-box; }
      #workspace[data-sidebar-open="false"] #tree-panel { display: none; }
      #workspace[data-sidebar-open="false"] #preview-panel { border-radius: 16px; }
      #workspace[data-compact="true"] { padding: 0; gap: 0; }
      #workspace[data-compact="true"] .review-panel { border-radius: 0; border-inline: 0; border-bottom: 0; }
      #workspace[data-compact="true"][data-sidebar-open="true"] #tree-panel { width: 100%; min-width: 100%; max-width: none; border-right: 0; }
      #workspace[data-compact="true"][data-sidebar-open="true"] #preview-panel { display: none; }
      .review-comment { position: relative; margin: 8px 14px 10px; padding: 10px 13px 10px 34px; border: 1px solid var(--review-border); border-radius: 12px; background: linear-gradient(180deg, rgba(120,169,255,.055), transparent), var(--review-panel-soft); color: var(--review-text); font: 13px/18px system-ui, sans-serif; white-space: pre-wrap; box-shadow: 0 8px 24px rgba(0,0,0,.16); }
      .review-comment::before { content: ""; position: absolute; left: 13px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--review-accent); box-shadow: 0 0 0 4px var(--review-accent-soft); }
      .review-composer { width: 100%; min-width: 0; padding: 9px 14px 11px; border-block: 1px solid rgba(120,169,255,.18); background: linear-gradient(90deg, rgba(120,169,255,.07), transparent 46%), #111317; }
      .review-composer-row { display: flex; align-items: flex-end; gap: 7px; }
      .review-composer-input { flex: 1; min-width: 180px; min-height: 40px; max-height: 120px; resize: none; overflow-y: auto; border: 1px solid var(--review-border-strong); outline: none; border-radius: 14px; padding: 9px 12px; background: var(--review-panel-soft); color: var(--review-text); font: 14px/20px system-ui, sans-serif; caret-color: var(--review-accent); box-shadow: inset 0 1px rgba(255,255,255,.02); }
      .review-composer-input:focus { border-color: rgba(120,169,255,.5); box-shadow: 0 0 0 3px var(--review-accent-soft); }
      .review-composer-input::placeholder { color: var(--review-dim); }
      .review-composer-button { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--review-border); border-radius: 14px; padding: 0; background: var(--review-panel-soft); color: var(--review-text); touch-action: manipulation; }
      .review-composer-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .review-composer-button:active { transform: scale(.96); }
      .review-composer-button.is-submit { border-color: transparent; background: var(--review-accent); color: #0a101a; }
      .review-composer-button.is-recording { background: #da3633; color: #fff; }
      .review-composer-button.is-pending svg { animation: review-spin 1s linear infinite; }
      .review-composer-button:disabled { opacity: .38; }
      .review-composer-error { padding: 6px 0 0; color: var(--review-red); font: 12px/16px system-ui, sans-serif; }
      @keyframes review-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="workspace" data-sidebar-open="false" data-compact="false">
      <section id="tree-panel" class="review-panel">
        <div id="tree"></div>
      </section>
      <section id="preview-panel" class="review-panel">
        <div id="preview"></div>
      </section>
    </div>
    <script src="code-review-editor.js"></script>
  </body>
</html>
