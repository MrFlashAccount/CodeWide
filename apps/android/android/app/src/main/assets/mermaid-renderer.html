<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #171b20; color: #eef2f6; overflow: hidden; overscroll-behavior: none; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #root[data-mode="inline"] { height: auto; min-height: 1px; padding: 10px; }
    #root[data-mode="inline"] #stage, #root[data-mode="inline"] #canvas { width: 100%; height: auto; }
    #root[data-mode="inline"] #canvas svg { display: block; width: 100%; max-width: none; height: auto; }
    #root[data-mode="preview"] #stage, #root[data-mode="preview"] #canvas { width: 100%; height: 100%; }
    #root[data-mode="preview"] #canvas svg { display: block; width: 100%; height: 100%; max-width: none; }
    #root[data-mode="fullscreen"] { touch-action: none; }
    #root[data-mode="fullscreen"] #stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
    #root[data-mode="fullscreen"] #canvas { position: absolute; inset: 0 auto auto 0; touch-action: none; will-change: transform; transform-origin: 0 0; }
    #root[data-mode="fullscreen"] #canvas svg { display: block; width: 100%; height: 100%; max-width: none; }
    #root[data-annotating="true"] #stage, #root[data-annotating="true"] #canvas { cursor: crosshair !important; }
  </style>
  <script src="diagram-preview.js"></script>
  <script src="mermaid.min.js"></script>
  <script src="panzoom.min.js"></script>
</head>
<body><main id="root"><div id="stage"><div id="canvas"></div></div></main>
<script>
  const root = document.getElementById('root');
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  let viewport = null;
  let scale = 1;
  let fitScale = 1;
  let minimumScale = .15;
  let naturalWidth = 1;
  let naturalHeight = 1;
  let currentMode = 'inline';
  let currentRequestId = -1;
  let annotationEnabled = false;
  let pointerStart = null;
  let resizeFrame = null;
  const viewportPointers = new Map();
  let viewportGesture = null;

  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'strict',
    suppressErrorRendering: true,
    theme: 'dark',
    htmlLabels: false,
    flowchart: { htmlLabels: false },
    themeVariables: {
      background: '#171b20', primaryColor: '#232931', primaryTextColor: '#eef2f6',
      primaryBorderColor: '#5f6b78', lineColor: '#9aa7b4', secondaryColor: '#1d2731',
      tertiaryColor: '#20252b', fontFamily: 'sans-serif'
    }
  });

  function send(message) {
    (window.CodeWideDiagramPreview || window.ReactNativeWebView).postMessage(JSON.stringify(message));
  }

  function reportSize(requestId, height) {
    requestAnimationFrame(function () {
      send({
        type: 'rendered',
        requestId,
        height: Math.ceil(height),
        width: Math.ceil(root.clientWidth),
        scale
      });
    });
  }

  function destroyViewport() {
    viewport = null;
    viewportGesture = null;
    viewportPointers.clear();
    canvas.style.removeProperty('transform');
    canvas.style.removeProperty('cursor');
  }

  function clampScale(value) {
    return Math.max(minimumScale, Math.min(8, value));
  }

  function applyViewport() {
    if (viewport === null) return;
    scale = viewport.scale;
    canvas.style.transform = 'translate3d(' + viewport.x + 'px,' + viewport.y + 'px,0) scale(' + viewport.scale + ')';
  }

  function zoomViewportAt(nextScale, point) {
    if (viewport === null) return;
    const boundedScale = clampScale(nextScale);
    const localX = (point.x - viewport.x) / viewport.scale;
    const localY = (point.y - viewport.y) / viewport.scale;
    viewport = {
      x: point.x - localX * boundedScale,
      y: point.y - localY * boundedScale,
      scale: boundedScale
    };
    applyViewport();
  }

  function viewportPoint(event) {
    const bounds = stage.getBoundingClientRect();
    return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
  }

  function firstTwoViewportPoints() {
    return Array.from(viewportPointers.values()).slice(0, 2);
  }

  function midpoint(first, second) {
    return { x: (first.x + second.x) / 2, y: (first.y + second.y) / 2 };
  }

  function distance(first, second) {
    return Math.hypot(second.x - first.x, second.y - first.y);
  }

  function beginViewportGesture() {
    if (viewport === null || viewportPointers.size === 0) {
      viewportGesture = null;
      return;
    }
    const points = firstTwoViewportPoints();
    if (points.length === 1) {
      viewportGesture = {
        kind: 'pan',
        pointer: points[0],
        x: viewport.x,
        y: viewport.y
      };
      return;
    }
    const center = midpoint(points[0], points[1]);
    viewportGesture = {
      kind: 'pinch',
      distance: Math.max(1, distance(points[0], points[1])),
      scale: viewport.scale,
      localX: (center.x - viewport.x) / viewport.scale,
      localY: (center.y - viewport.y) / viewport.scale
    };
  }

  function updateViewportGesture() {
    if (viewport === null || viewportGesture === null) return;
    const points = firstTwoViewportPoints();
    if (viewportGesture.kind === 'pan' && points.length === 1) {
      if (annotationEnabled) return;
      viewport.x = viewportGesture.x + points[0].x - viewportGesture.pointer.x;
      viewport.y = viewportGesture.y + points[0].y - viewportGesture.pointer.y;
      applyViewport();
      return;
    }
    if (viewportGesture.kind !== 'pinch' || points.length < 2) return;
    const center = midpoint(points[0], points[1]);
    const nextScale = clampScale(viewportGesture.scale * distance(points[0], points[1]) / viewportGesture.distance);
    viewport = {
      x: center.x - viewportGesture.localX * nextScale,
      y: center.y - viewportGesture.localY * nextScale,
      scale: nextScale
    };
    applyViewport();
  }

  stage.addEventListener('pointerdown', function (event) {
    if (currentMode !== 'fullscreen' || viewport === null) return;
    viewportPointers.set(event.pointerId, viewportPoint(event));
    if (event.isTrusted) stage.setPointerCapture?.(event.pointerId);
    beginViewportGesture();
    event.preventDefault();
  });
  document.addEventListener('pointermove', function (event) {
    if (!viewportPointers.has(event.pointerId)) return;
    viewportPointers.set(event.pointerId, viewportPoint(event));
    updateViewportGesture();
  }, { passive: true });
  function endViewportPointer(event) {
    if (!viewportPointers.has(event.pointerId)) return;
    viewportPointers.delete(event.pointerId);
    if (stage.hasPointerCapture?.(event.pointerId)) stage.releasePointerCapture(event.pointerId);
    beginViewportGesture();
  }
  document.addEventListener('pointerup', endViewportPointer, { passive: true });
  document.addEventListener('pointercancel', endViewportPointer, { passive: true });
  stage.addEventListener('wheel', function (event) {
    if (currentMode !== 'fullscreen' || viewport === null) return;
    event.preventDefault();
    zoomViewportAt(viewport.scale * Math.exp(-event.deltaY * .0015), viewportPoint(event));
  }, { passive: false });

  window.diagramZoom = function (factor, requestId) {
    if (viewport === null) return;
    zoomViewportAt(viewport.scale * factor, { x: stage.clientWidth / 2, y: stage.clientHeight / 2 });
    reportSize(requestId, innerHeight);
  };

  window.diagramReset = function (requestId) {
    if (viewport === null) return;
    layoutFullscreen(canvas.querySelector('svg'), requestId);
  };

  window.diagramSetAnnotationMode = function (enabled) {
    annotationEnabled = enabled === true && currentMode === 'fullscreen';
    root.dataset.annotating = annotationEnabled ? 'true' : 'false';
  };

  function addReviewPoint(x, y, index, pending) {
    const svg = canvas.querySelector('svg');
    if (!svg) return;
    const box = svg.viewBox && svg.viewBox.baseVal;
    if (!box || box.width <= 0 || box.height <= 0) return;
    let layer = svg.querySelector('[data-codewide-review-points]');
    if (!layer) {
      layer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      layer.setAttribute('data-codewide-review-points', 'true');
      layer.setAttribute('pointer-events', 'none');
      svg.appendChild(layer);
    }
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    const radius = Math.max(4, Math.min(box.width, box.height) * .016);
    circle.setAttribute('cx', String(box.x + Math.max(0, Math.min(1, x)) * box.width));
    circle.setAttribute('cy', String(box.y + Math.max(0, Math.min(1, y)) * box.height));
    circle.setAttribute('r', String(radius));
    circle.setAttribute('fill', pending ? '#ffffff' : '#b794f6');
    circle.setAttribute('stroke', '#0b0b0b');
    circle.setAttribute('stroke-width', String(Math.max(1.5, radius * .22)));
    layer.appendChild(circle);
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', circle.getAttribute('cx'));
    label.setAttribute('y', circle.getAttribute('cy'));
    label.setAttribute('fill', '#0b0b0b');
    label.setAttribute('font-size', String(radius * 1.1));
    label.setAttribute('font-family', 'sans-serif');
    label.setAttribute('font-weight', '800');
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('dominant-baseline', 'central');
    label.textContent = String(index);
    layer.appendChild(label);
  }

  window.diagramSetReviewPoints = function (points) {
    const svg = canvas.querySelector('svg');
    if (!svg) return;
    svg.querySelector('[data-codewide-review-points]')?.remove();
    if (!Array.isArray(points)) return;
    points.forEach(function (point, index) {
      if (!point || typeof point.x !== 'number' || typeof point.y !== 'number') return;
      addReviewPoint(point.x, point.y, index + 1, point.pending === true);
    });
  };

  function reviewPointAt(clientX, clientY) {
    const svg = canvas.querySelector('svg');
    if (!svg || !svg.getScreenCTM()) return;
    const box = svg.viewBox && svg.viewBox.baseVal;
    if (!box || box.width <= 0 || box.height <= 0) return;
    const point = svg.createSVGPoint();
    point.x = clientX;
    point.y = clientY;
    const local = point.matrixTransform(svg.getScreenCTM().inverse());
    send({
      type: 'reviewPoint',
      requestId: currentRequestId,
      x: Math.max(0, Math.min(1, (local.x - box.x) / box.width)),
      y: Math.max(0, Math.min(1, (local.y - box.y) / box.height))
    });
  }

  stage.addEventListener('pointerdown', function (event) {
    if (!annotationEnabled || viewportPointers.size > 1) {
      pointerStart = null;
      return;
    }
    pointerStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
  });
  stage.addEventListener('pointercancel', function () { pointerStart = null; });
  stage.addEventListener('pointerup', function (event) {
    if (!annotationEnabled || !pointerStart || pointerStart.id !== event.pointerId) return;
    const distance = Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y);
    pointerStart = null;
    if (distance <= 10) reviewPointAt(event.clientX, event.clientY);
  });

  function viewBoxSize(svg) {
    const viewBox = svg.viewBox && svg.viewBox.baseVal;
    if (viewBox && viewBox.width > 0 && viewBox.height > 0) {
      return { width: viewBox.width, height: viewBox.height };
    }
    const bounds = svg.getBBox();
    return { width: Math.max(1, bounds.width), height: Math.max(1, bounds.height) };
  }

  async function waitForViewport(mode) {
    for (let frame = 0; frame < 60; frame += 1) {
      if (root.clientWidth > 0 && (mode !== 'fullscreen' || root.clientHeight > 0)) return;
      await new Promise(requestAnimationFrame);
    }
    throw new Error('Mermaid viewport has no measurable size');
  }

  function layoutInline(svg, requestId) {
    destroyViewport();
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    const size = viewBoxSize(svg);
    const availableWidth = Math.max(1, root.clientWidth - 20);
    const renderedHeight = availableWidth * size.height / size.width;
    reportSize(requestId, renderedHeight + 20);
  }

  function fullscreenFitScale() {
    return Math.max(.02, Math.min(1, stage.clientWidth / naturalWidth, stage.clientHeight / naturalHeight));
  }

  function layoutFullscreen(svg, requestId) {
    destroyViewport();
    if (!svg) return;
    const size = viewBoxSize(svg);
    naturalWidth = Math.max(1, Math.ceil(size.width));
    naturalHeight = Math.max(1, Math.ceil(size.height));
    canvas.style.width = naturalWidth + 'px';
    canvas.style.height = naturalHeight + 'px';
    fitScale = fullscreenFitScale();
    minimumScale = Math.min(.15, fitScale);
    viewport = {
      x: (stage.clientWidth - naturalWidth * fitScale) / 2,
      y: (stage.clientHeight - naturalHeight * fitScale) / 2,
      scale: fitScale
    };
    canvas.style.cursor = 'move';
    applyViewport();
    reportSize(requestId, innerHeight);
  }

  window.addEventListener('resize', function () {
    if (currentMode !== 'fullscreen' || viewport === null) return;
    if (resizeFrame !== null) cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(function () {
      resizeFrame = null;
      if (currentMode !== 'fullscreen' || viewport === null) return;
      const svg = canvas.querySelector('svg');
      if (svg) layoutFullscreen(svg, currentRequestId);
    });
  });

  window.renderMermaid = async function (source, requestId, mode) {
    try {
      canvas.replaceChildren();
      destroyViewport();
      scale = 1;
      currentMode = mode === 'fullscreen' ? 'fullscreen' : mode === 'preview' ? 'preview' : 'inline';
      currentRequestId = requestId;
      annotationEnabled = false;
      root.dataset.annotating = 'false';
      root.dataset.mode = currentMode;
      if (mode !== 'preview') await waitForViewport(currentMode);
      const result = await mermaid.render('diagram-' + requestId, source, canvas);
      canvas.innerHTML = result.svg;
      const svg = canvas.querySelector('svg');
      if (svg) {
        svg.removeAttribute('height');
        svg.removeAttribute('width');
        const box = svg.getBBox();
        if (!svg.getAttribute('viewBox') && box.width > 0 && box.height > 0) {
          svg.setAttribute('viewBox', [box.x, box.y, box.width, box.height].join(' '));
        }
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      }
      if (!svg) throw new Error('Mermaid returned no SVG');
      if (mode === 'preview') {
        const size = viewBoxSize(svg);
        send({ type: 'preview-ready', requestId, width: size.width, height: size.height });
        return;
      }
      if (currentMode === 'fullscreen') layoutFullscreen(svg, requestId);
      else layoutInline(svg, requestId);
    } catch (error) {
      canvas.replaceChildren();
      send({ type: 'error', requestId, message: error instanceof Error ? error.message : String(error) });
    }
  };

  send({ type: 'ready' });
</script></body>
</html>
