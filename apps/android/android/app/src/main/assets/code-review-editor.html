<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <style>
      :root {
        color-scheme: dark;
        -webkit-tap-highlight-color: transparent;
        /* Dense IDE-like code: more reviewed lines per screen than Pierre's 13px/20px default. */
        --diffs-font-size: 12px;
        --diffs-line-height: 17px;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--review-canvas);
      }
      * {
        box-sizing: border-box;
      }
      button,
      textarea,
      input {
        font: inherit;
      }
      :focus:not(:focus-visible) {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid var(--review-accent);
        outline-offset: -2px;
      }
      [hidden] {
        display: none !important;
      }
      #workspace {
        height: 100%;
        display: flex;
        flex-direction: column;
        color: var(--review-text);
        font:
          14px/1.35 system-ui,
          sans-serif;
      }
      button {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        appearance: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      #close-files {
        display: grid;
        place-items: center;
        min-width: var(--review-control-regular);
        height: 100%;
        padding: 0;
      }
      .review-icon {
        display: block;
        flex: none;
        width: var(--review-icon-inline);
        height: var(--review-icon-inline);
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #close-files svg {
        width: var(--review-icon-action);
        height: var(--review-icon-action);
      }
      #review-body {
        display: flex;
        flex: 1;
        min-height: 0;
        background: var(--review-panel);
      }
      #tree-panel {
        height: 100%;
        min-height: 0;
        max-height: 100%;
        position: relative;
        inset: auto;
        margin: 0;
        padding: 0;
        flex: none;
        width: var(--review-sidebar-width);
        border: 0;
        color: var(--review-text);
        background: var(--review-panel);
        overflow: hidden;
      }
      #tree-panel[open] {
        display: flex;
        flex-direction: column;
      }
      #tree-panel:modal {
        position: fixed;
        inset: auto 0 0;
        width: 100%;
        max-width: none;
        height: 60%;
        max-height: 94%;
        border: 0;
        border-radius: 20px 20px 0 0;
        background: var(--review-panel-raised);
      }
      #tree-panel:focus {
        /* The dialog receives initial focus without opening the search keyboard. */
        outline: none;
      }
      #tree-panel::backdrop {
        background: var(--review-scrim);
        opacity: var(--sheet-scrim-opacity, 1);
      }
      #file-grip {
        display: none;
      }
      #tree-panel:modal #file-grip {
        display: grid;
        place-items: center;
        min-height: 32px;
        touch-action: none;
      }
      #file-grip::after {
        content: "";
        background: var(--review-dim);
        height: 4px;
        width: 34px;
        border-radius: 3px;
      }
      #file-grip:active::after {
        background: var(--review-text);
      }
      #close-files:active {
        background: var(--review-panel-soft);
        border-radius: var(--review-search-radius);
      }
      #file-tools {
        display: flex;
        align-items: center;
        flex: none;
        gap: 4px;
        padding: 4px 8px;
      }
      #no-matches {
        color: var(--review-muted);
      }
      #close-files {
        height: var(--review-control-regular);
      }
      #tree-panel:not(:modal) #close-files {
        display: none;
      }
      #search-field {
        display: flex;
        flex: 1;
        min-width: 0;
        height: var(--review-control-regular);
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        border-radius: var(--review-search-radius);
        background: var(--review-panel-soft);
        color: var(--review-muted);
      }
      #search-field:focus-within {
        outline: 1px solid var(--review-muted);
        outline-offset: -1px;
      }
      #file-search {
        width: 100%;
        min-width: 0;
        height: 100%;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--review-text);
        font-size: 13px;
      }
      #file-search::placeholder {
        color: var(--review-muted);
      }
      #no-matches {
        padding: 6px 12px;
        font-size: 13px;
      }
      #tree-totals {
        color: var(--review-muted);
        font-size: 12px;
        padding: 6px 12px;
      }
      #preview[data-review-actions]::after {
        content: "";
        display: block;
        height: 72px;
      }
      #tree {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        --trees-font-size-override: 12px;
        --trees-bg-override: var(--review-panel);
        --trees-fg-override: var(--review-muted);
        --trees-selected-fg-override: var(--review-text);
        --trees-selected-bg-override: var(--review-panel-soft);
        --trees-accent-override: var(--review-accent);
        --trees-status-added-override: var(--review-green);
        --trees-status-modified-override: var(--review-text);
        --trees-status-renamed-override: var(--review-muted);
        --trees-status-untracked-override: var(--review-green);
        --trees-status-deleted-override: var(--review-red);
        --trees-padding-inline-override: 6px;
        --truncate-marker-fade-in-duration: 0s;
      }
      #tree-panel:modal #tree {
        --trees-bg-override: var(--review-panel-raised);
      }
      #tree-panel:modal file-tree-container {
        --review-tree-end-space: var(--trees-item-height);
      }
      #preview-panel {
        flex: 1;
        min-width: 0;
        min-height: 0;
        position: relative;
        display: flex;
      }
      #tree-panel[open]:not(:modal) + #preview-panel {
        border-radius: var(--review-pane-radius) 0 0 var(--review-pane-radius);
        overflow: hidden;
      }
      #preview {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        touch-action: pan-x pan-y;
        background: var(--review-canvas);
      }
      .pierre-preview-host {
        min-width: 100%;
        min-height: 100%;
      }
      .pierre-preview-host diffs-container {
        --diffs-bg: var(--review-canvas);
      }
      #image-preview {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        padding: 16px;
        width: 100%;
      }
      #image-preview[hidden] {
        display: none;
      }
      #image-preview img {
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
      }
      .review-raw-patch-label {
        padding: 14px 18px;
        border-top: 1px solid var(--review-border-strong);
        color: var(--review-muted);
        font:
          13px/19px system-ui,
          sans-serif;
      }
      .review-raw-patch {
        margin: 0;
        padding: 0 18px 14px;
        font: var(--diffs-font-size) / var(--diffs-line-height) monospace;
        white-space: pre;
        user-select: text;
      }
      [data-wrap="true"] .review-raw-patch {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .review-empty {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 28px;
        text-align: center;
        pointer-events: none;
      }
      .review-empty[hidden] {
        display: none;
      }
      .review-empty-mark {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        margin-bottom: 3px;
        border: 1px solid var(--review-border-strong);
        border-radius: 14px;
        background: var(--review-panel-raised);
        color: var(--review-dim);
        font:
          600 18px/1 system-ui,
          sans-serif;
      }
      .review-empty-title {
        color: var(--review-text);
        font:
          650 15px/20px system-ui,
          sans-serif;
      }
      .review-empty-message {
        max-width: 340px;
        color: var(--review-muted);
        font:
          13px/19px system-ui,
          sans-serif;
      }
      .review-empty[data-loading="true"] .review-empty-title {
        color: transparent;
        background: linear-gradient(
          90deg,
          var(--review-muted) 20%,
          var(--review-text) 50%,
          var(--review-muted) 80%
        );
        background-size: 220% 100%;
        background-position: 220% 0;
        background-clip: text;
        -webkit-background-clip: text;
        animation: review-loading-shimmer 1.35s linear infinite;
      }
      @keyframes review-loading-shimmer {
        to {
          background-position: -220% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .review-empty[data-loading="true"] .review-empty-title {
          color: var(--review-muted);
          background: none;
          animation: none;
        }
      }
      #preview::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      #preview::-webkit-scrollbar-track {
        background: transparent;
      }
      #preview::-webkit-scrollbar-thumb {
        border: 2px solid transparent;
        border-radius: 999px;
        background: var(--review-border-strong);
        background-clip: content-box;
      }
      .review-comment {
        position: relative;
        margin: 8px 14px 10px;
        padding: 10px 13px 10px 34px;
        border: 1px solid var(--review-border);
        border-radius: 12px;
        background: var(--review-panel-soft);
        color: var(--review-text);
        font:
          13px/18px system-ui,
          sans-serif;
        white-space: pre-wrap;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      }
      .review-comment::before {
        content: "";
        position: absolute;
        left: 13px;
        top: 14px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--review-accent);
        box-shadow: 0 0 0 4px var(--review-accent-soft);
      }
      /* A comment being saved keeps its text in place under the text shimmer. */
      .review-comment[data-state="pending"] .review-comment-body {
        background: linear-gradient(
            100deg,
            var(--review-text) 0%,
            var(--review-text) 38%,
            var(--review-dim) 50%,
            var(--review-text) 62%,
            var(--review-text) 100%
          )
          0 0 / 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: review-shimmer 1.6s linear infinite;
      }
      .review-comment[data-state="failed"] {
        border-color: var(--review-red);
      }
      .review-comment[data-state="failed"]::before {
        background: var(--review-red);
        box-shadow: 0 0 0 4px var(--review-error-container);
      }
      .review-comment-error {
        padding-top: 6px;
        color: var(--review-red);
        font:
          12px/16px system-ui,
          sans-serif;
      }
      @keyframes review-shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -120% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .review-comment[data-state="pending"] .review-comment-body {
          animation: none;
          background: none;
          color: var(--review-muted);
        }
      }
    </style>
  </head>
  <body>
    <div id="workspace">
      <main id="review-body">
        <dialog id="tree-panel" aria-label="Changed files" autofocus>
          <button id="file-grip"></button>
          <div id="file-tools">
            <label id="search-field">
              <svg class="review-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="7"></circle>
                <path d="m16 16 5 5"></path>
              </svg>
              <input
                id="file-search"
                type="search"
                aria-label="Filter changed files"
                placeholder="Find file…"
                autocomplete="off"
              />
            </label>
            <button id="close-files" aria-label="Close file picker">
              <svg class="review-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 6 12 12m0-12L6 18"></path>
              </svg>
            </button>
          </div>
          <div id="no-matches" role="status" hidden>No matching files</div>
          <div id="tree"></div>
          <div id="tree-totals" hidden></div>
          <div id="tree-empty" class="review-empty" hidden>
            <div class="review-empty-mark">—</div>
            <div class="review-empty-title" data-empty-title></div>
            <div class="review-empty-message" data-empty-message></div>
          </div>
        </dialog>
        <section id="preview-panel" class="review-panel">
          <div id="preview">
            <div id="image-preview" hidden><img id="review-image" alt="Changed image" /></div>
          </div>
          <div id="preview-empty" class="review-empty" hidden>
            <div class="review-empty-mark">—</div>
            <div class="review-empty-title" data-empty-title></div>
            <div class="review-empty-message" data-empty-message></div>
          </div>
        </section>
      </main>
    </div>
    <script src="code-review-editor.js?v=c14d8491d88f7491"></script>
  </body>
</html>
