[workspace]
members = ["apps/companion"]
exclude = ["openai-codex/codex-rs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
needless_pass_by_ref_mut = "deny"
panic = "deny"
suspicious_operation_groupings = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
