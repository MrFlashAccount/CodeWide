<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>CodeWide Preview</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #07080a; color: #f6f7f9; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 12% 8%, #265eb955 0, transparent 33rem), radial-gradient(circle at 94% 90%, #a43d8750 0, transparent 30rem), #07080a; }
      main { width: min(720px, calc(100% - 28px)); margin: 0 auto; padding: 64px 0 48px; }
      .eyebrow { display: inline-flex; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid #ffffff24; border-radius: 999px; background: #ffffff0d; color: #d6dae1; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #f7b84b; box-shadow: 0 0 16px #f7b84b; }
      h1 { margin: 24px 0 12px; font-size: clamp(44px, 10vw, 76px); line-height: .96; letter-spacing: -.055em; }
      .lead { margin: 0 0 36px; color: #afb5c0; font-size: 19px; line-height: 1.55; }
      .card { padding: 28px; border: 1px solid #ffffff20; border-radius: 28px; background: linear-gradient(145deg, #191b20e8, #0d0f13e8); box-shadow: 0 20px 70px #00000055; }
      .platform { color: #8f97a4; font-size: 13px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
      h2 { margin: 10px 0 8px; font-size: 30px; letter-spacing: -.03em; }
      .meta { min-height: 74px; margin: 0; color: #aab0ba; line-height: 1.6; }
      .download { display: flex; justify-content: center; margin-top: 28px; padding: 15px 18px; border-radius: 14px; background: #f5f6f8; color: #08090b; font-weight: 800; text-decoration: none; }
      .checksum { display: inline-block; margin-top: 12px; color: #aab7cc; font-size: 13px; text-decoration: none; }
      footer { padding-top: 24px; color: #6f7682; font-size: 13px; line-height: 1.55; }
      code { overflow-wrap: anywhere; color: #c6cfdd; font-family: "SFMono-Regular", Consolas, monospace; }
      @media (max-width: 560px) { main { padding-top: 32px; } .card { padding: 23px; border-radius: 22px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow"><span class="dot"></span> Тестовая сборка</div>
      <h1>CodeWide Preview</h1>
      <p class="lead">Отдельное приложение для проверки интеграционной ветки. Оно ставится рядом с production-версией.</p>
      <article class="card">
        <div class="platform">Android · arm64-v8a</div>
        <h2>Версия <span id="version">0.0.0.0</span></h2>
        <p class="meta" id="meta">Загрузка данных сборки…</p>
        <a class="download" href="CodeWide-Preview.apk" download>Скачать APK</a>
        <a class="checksum" href="CodeWide-Preview.apk.sha256">SHA-256 checksum</a>
      </article>
      <footer>Пакет <code id="package">dev.codexremote.app.preview</code><br />revision <code id="revision">—</code></footer>
    </main>
    <script>
      fetch("manifest.json", { cache: "no-store" })
        .then((response) => response.json())
        .then((manifest) => {
          const artifact = manifest.artifacts[0];
          document.querySelector("#version").textContent = artifact.versionName;
          document.querySelector("#meta").textContent = `versionCode ${artifact.versionCode} · ${(artifact.size / 1048576).toFixed(1)} MiB · обновления Expo отключены`;
          document.querySelector("#package").textContent = artifact.applicationId;
          document.querySelector("#revision").textContent = `${manifest.revision}${manifest.sourceDirty ? " (dirty)" : ""}`;
        })
        .catch(() => { document.querySelector("#meta").textContent = "Манифест сборки недоступен"; });
    </script>
  </body>
</html>
