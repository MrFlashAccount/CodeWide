name: Relay Release
run-name: Relay ${{ inputs.version }} (${{ inputs.request_id || github.run_id }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, for example 0.1.0 or v0.1.0"
        required: true
        type: string
      base:
        description: "Git ref to compare against; defaults to the latest Relay tag"
        required: false
        type: string
      dry_run:
        description: "Build and validate without publishing a tag or release"
        required: false
        default: false
        type: boolean
      force:
        description: "Allow a release even when Nx does not select Relay"
        required: false
        default: false
        type: boolean
      request_id:
        description: "Correlation id used by the one-shot release command"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      base:
        required: false
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
      force:
        required: false
        default: false
        type: boolean
      request_id:
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      NX_CACHE_DIRECTORY: .nx/cache
      NX_TUI: "false"
      CODEWIDE_RELAY_CACHE_ROOT: ${{ github.workspace }}/.cache/relay-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Linux Cargo build cache
        uses: actions/cache@v6.1.0
        with:
          path: .cache/relay-linux
          key: cargo-relay-linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/build-relay-linux') }}-${{ github.sha }}
          restore-keys: |
            cargo-relay-linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/build-relay-linux') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Relay is affected
        if: ${{ inputs.force != true }}
        env:
          REQUESTED_BASE: ${{ inputs.base }}
        run: |
          base="$REQUESTED_BASE"
          if [[ -z "$base" ]]; then
            base=$(git describe --tags --match 'relay-v[0-9]*' --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi
          node scripts/release-plan.ts --base "$base" --head "$GITHUB_SHA" --assert-target relay

      - name: Resolve version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RAW_VERSION"
            exit 1
          fi
          echo "CODEWIDE_RELAY_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=relay-v$version" >> "$GITHUB_ENV"
          echo "ASSET=dist/relay/codewide-relay-x86_64-unknown-linux-musl" >> "$GITHUB_ENV"

      - name: Build portable binary
        run: ./scripts/build-relay-linux

      - name: Validate standalone installer
        env:
          CODEWIDE_RELAY_DIST_DIR: ${{ github.workspace }}/dist/relay
        run: ./scripts/install-relay.test.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: codewide-relay-${{ env.CODEWIDE_RELAY_VERSION }}-linux-x86_64
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

      - name: Create release tag
        if: ${{ inputs.dry_run != true }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "CodeWide Relay $RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="CodeWide Relay $CODEWIDE_RELAY_VERSION. Portable static x86_64 binary with a checksummed standalone installer."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" \
              --title "CodeWide Relay $CODEWIDE_RELAY_VERSION" \
              --notes "$notes" \
              --latest=false
          fi
