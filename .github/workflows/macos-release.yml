name: macOS Release
run-name: macOS ${{ inputs.bump || inputs.version }} (${{ inputs.request_id || github.run_id }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      base:
        description: "Git ref to compare against; defaults to the latest version tag"
        required: false
        type: string
      dry_run:
        description: "Build and prove the update without publishing a tag or release"
        required: false
        default: false
        type: boolean
      force:
        description: "Allow a release even when Nx does not select macOS"
        required: false
        default: false
        type: boolean
      request_id:
        description: "Correlation id used by the one-shot release command"
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
      version:
        required: true
        type: string
      base:
        required: false
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
      force:
        required: false
        default: false
        type: boolean
      request_id:
        required: false
        type: string
    secrets:
      SPARKLE_ED25519_PUBLIC_KEY:
        required: true
      SPARKLE_ED25519_PRIVATE_KEY:
        required: true
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release
    env:
      NX_CACHE_DIRECTORY: .nx/cache
      NX_TUI: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Cargo and SwiftPM caches
        id: native-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            apps/companion-macos/.build/arm64-apple-macosx
            apps/companion-macos/.build/artifacts
            apps/companion-macos/.build/checkouts
            apps/companion-macos/.build/repositories
            apps/companion-macos/.build/workspace-state.json
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: native-macos-arm64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'apps/companion-macos/Package.resolved') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-macos-arm64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'apps/companion-macos/Package.resolved') }}-
            native-macos-arm64-
            native-macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'apps/companion-macos/Package.resolved') }}-

      - name: Restore Nx build cache
        id: nx-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .nx/cache
          key: nx-macos-release-arm64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nx-macos-release-arm64-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate macOS version rules
        run: sh scripts/macos-build-version.test.sh

      - name: Verify macOS is affected
        if: ${{ inputs.force != true }}
        env:
          REQUESTED_BASE: ${{ inputs.base }}
        run: |
          base="$REQUESTED_BASE"
          if [[ -z "$base" ]]; then
            base=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi
          node scripts/release-plan.ts --base "$base" --head "$GITHUB_SHA" --assert-target macos

      - name: Show toolchains
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          rustc --version

      - name: Download pinned Sparkle tools
        run: |
          archive="$RUNNER_TEMP/Sparkle-2.10.0.tar.xz"
          destination="$RUNNER_TEMP/sparkle"
          curl --fail --location --silent --show-error \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz \
            --output "$archive"
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $archive" \
            | shasum --algorithm 256 --check
          mkdir -p "$destination"
          tar -xJf "$archive" -C "$destination"
          echo "SPARKLE_BIN=$destination/bin" >> "$GITHUB_ENV"

      - name: Reuse previous published app for the update test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(sh scripts/latest-published-release)
          test -n "$previous_tag"
          destination="$RUNNER_TEMP/baseline-download"
          mkdir -p "$destination" "$RUNNER_TEMP/baseline"
          previous_version="${previous_tag#v}"
          if [[ "$previous_tag" == release-* ]]; then
            inventory_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$previous_tag" \
              --jq '.assets[] | select(.name == "release-manifest.json") | .digest')
            [[ "$inventory_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            gh release download "$previous_tag" --pattern release-manifest.json --dir "$destination"
            printf '%s  %s\n' "${inventory_digest#sha256:}" "$destination/release-manifest.json" | shasum --algorithm 256 --check
            previous_version=$(jq -er '.products[] | select(.id == "macos") | .version' "$destination/release-manifest.json")
            previous_tag=$(jq -er '.products[] | select(.id == "macos") | .sourceTag' "$destination/release-manifest.json")
          fi
          asset="CodeWide-$previous_version.dmg"
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$previous_tag" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh release download "$previous_tag" --pattern "$asset" --dir "$destination"
          printf '%s  %s\n' "${digest#sha256:}" "$destination/$asset" | shasum --algorithm 256 --check
          mount="$RUNNER_TEMP/baseline-mount"
          mkdir -p "$mount"
          hdiutil attach "$destination/$asset" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/CodeWide.app" "$RUNNER_TEMP/baseline/CodeWide.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/baseline/CodeWide.app"
          test "$(plutil -extract CFBundleShortVersionString raw \
            "$RUNNER_TEMP/baseline/CodeWide.app/Contents/Info.plist")" = "$previous_version"
          echo "CODEWIDE_PREVIOUS_MACOS_VERSION=$previous_version" >> "$GITHUB_ENV"

      - name: Resolve version
        env:
          RAW_VERSION: ${{ inputs.version }}
          VERSION_BUMP: ${{ inputs.bump }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RAW_VERSION" ]]; then
            version="${RAW_VERSION#v}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
              echo "Invalid version: $RAW_VERSION"
              exit 1
            fi
          else
            version=$(./scripts/next-macos-version "$VERSION_BUMP" "$CODEWIDE_PREVIOUS_MACOS_VERSION")
          fi
          build_number=$(./scripts/macos-build-version "$version")
          sh scripts/assert-newer-macos-version "$version" "$CODEWIDE_PREVIOUS_MACOS_VERSION"
          echo "Releasing $version."
          echo "CODEWIDE_VERSION=$version" >> "$GITHUB_ENV"
          echo "CODEWIDE_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${REQUESTED_RELEASE_TAG:-v$version}" >> "$GITHUB_ENV"
          echo "DMG_PATH=apps/companion-macos/dist/CodeWide-$version.dmg" >> "$GITHUB_ENV"
          echo "APPCAST_PATH=apps/companion-macos/dist/appcast.xml" >> "$GITHUB_ENV"

      - name: Build or restore ARM64 Core and FFI
        id: core-build
        env:
          CODEWIDE_CORE_VERSION: ${{ env.CODEWIDE_VERSION }}
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: |
          output="apps/companion-macos/.build/rust/$CODEWIDE_VERSION"
          pnpm nx run companion-swift-ffi:build-macos-arm64 --outputPath="$output"
          test -s "$output/libcompanion_swift_ffi.a"
          echo "CODEWIDE_FFI_ARCHIVE=$GITHUB_WORKSPACE/$output/libcompanion_swift_ffi.a" >> "$GITHUB_ENV"

      - name: Build ARM64 release app
        id: app-build
        env:
          CODEWIDE_SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_ED25519_PUBLIC_KEY }}
        run: |
          test -n "$CODEWIDE_SPARKLE_PUBLIC_KEY"
          apps/companion-macos/scripts/build-app.sh
          test "$(lipo -archs apps/companion-macos/.build/app/CodeWide.app/Contents/MacOS/CodeWide)" = arm64
          test "$(lipo -archs apps/companion-macos/.build/app/CodeWide.app/Contents/MacOS/CodeWideRuntime)" = arm64
          apps/companion-macos/scripts/build-dmg.sh "$CODEWIDE_VERSION"

      - name: Save native compilation cache before update validation
        if: ${{ always() && !cancelled() && steps.core-build.outcome == 'success' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            apps/companion-macos/.build/arm64-apple-macosx
            apps/companion-macos/.build/artifacts
            apps/companion-macos/.build/checkouts
            apps/companion-macos/.build/repositories
            apps/companion-macos/.build/workspace-state.json
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Save Nx Core and FFI results before update validation
        if: ${{ always() && !cancelled() && steps.core-build.outcome == 'success' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .nx/cache
          key: ${{ steps.nx-cache.outputs.cache-primary-key }}

      - name: Test ARM64 macOS update scheduling and runtime
        run: swift test --package-path apps/companion-macos --arch arm64

      - name: Prove update, state migration, and runtime recovery
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
          CODEWIDE_ALLOW_DESTRUCTIVE_UPDATE_E2E: "1"
        run: |
          apps/companion-macos/scripts/update-e2e.sh \
            "$RUNNER_TEMP/baseline/CodeWide.app" \
            "$DMG_PATH" \
            "$SPARKLE_BIN" \
            "$CODEWIDE_VERSION"

      - name: Generate signed production feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/MrFlashAccount/CodeWide/releases/download/$RELEASE_TAG/" \
            --link "https://github.com/MrFlashAccount/CodeWide" \
            --maximum-versions 1 \
            apps/companion-macos/dist
          xmllint --noout "$APPCAST_PATH"
          grep -q "<sparkle:version>$CODEWIDE_BUILD_NUMBER</sparkle:version>" "$APPCAST_PATH"
          grep -q 'sparkle:edSignature=' "$APPCAST_PATH"
          grep -q 'sparkle-signatures:' "$APPCAST_PATH"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/sign_update" \
            --ed-key-file - --verify "$APPCAST_PATH"

      - name: Verify ad-hoc artifact
        run: |
          codesign --verify --deep --strict --verbose=2 apps/companion-macos/.build/app/CodeWide.app
          hdiutil verify "$DMG_PATH"
          if spctl --assess --type execute apps/companion-macos/.build/app/CodeWide.app; then
            echo "Gatekeeper accepted the ad-hoc app."
          else
            echo "Expected: this build is ad-hoc signed and not notarized."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: CodeWide-${{ env.CODEWIDE_VERSION }}
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.APPCAST_PATH }}
          if-no-files-found: error

      - name: Validate Homebrew tap generation
        run: sh scripts/update-homebrew-tap.test.sh

      - name: Create release tag
        if: ${{ inputs.dry_run != true }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "CodeWide $RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="CodeWide $RELEASE_TAG. Ad-hoc signed and not notarized; macOS may warn on first launch."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DMG_PATH" "$APPCAST_PATH" --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" "$DMG_PATH" "$APPCAST_PATH" \
              --title "CodeWide $RELEASE_TAG" --notes "$notes" --latest
          fi

      - name: Update Homebrew tap
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          test -n "$TAP_DEPLOY_KEY"
          tap_root="$RUNNER_TEMP/homebrew-codewide"
          ssh_root="$RUNNER_TEMP/homebrew-ssh"
          mkdir -p "$ssh_root"
          chmod 0700 "$ssh_root"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$ssh_root/id_ed25519"
          chmod 0600 "$ssh_root/id_ed25519"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh_root/known_hosts"
          GIT_SSH_COMMAND="ssh -i $ssh_root/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_root/known_hosts" \
            git clone git@github.com:MrFlashAccount/homebrew-codewide.git "$tap_root"
          sha256=$(shasum --algorithm 256 "$DMG_PATH" | awk '{print $1}')
          ./scripts/update-homebrew-tap macos "$CODEWIDE_VERSION" "$sha256" "$tap_root"
          git -C "$tap_root" config user.name "github-actions[bot]"
          git -C "$tap_root" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap_root" add Casks/codewide.rb versions/macos releases/macos
          if git -C "$tap_root" diff --cached --quiet; then
            exit 0
          fi
          git -C "$tap_root" commit -m "codewide $CODEWIDE_VERSION"
          attempt=0
          until GIT_SSH_COMMAND="ssh -i $ssh_root/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_root/known_hosts" \
            git -C "$tap_root" push origin HEAD:main; do
            attempt=$((attempt + 1))
            test "$attempt" -lt 3
            GIT_SSH_COMMAND="ssh -i $ssh_root/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_root/known_hosts" \
              git -C "$tap_root" pull --rebase origin main
          done
