name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

env:
  NX_TUI: "false"

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      NX_CACHE_DIRECTORY: .nx/cache
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Restore Nx task cache
        uses: actions/cache@v6.1.0
        with:
          path: .nx/cache
          key: nx-linux-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-linux-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock') }}-

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          cargo --version
          cargo clippy --version

      # Dependencies only (workspace crates and incremental state are left
      # out), keyed by Cargo.lock and the toolchain, saved from main only:
      # one entry per lockfile instead of one per commit and branch, so the
      # repository cache budget keeps the release jobs' caches.
      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: ci-linux
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve affected range
        uses: nrwl/nx-set-shas@v5.0.1

      - name: Validate release compatibility
        run: pnpm release:compatibility

      - name: Check, test, and build affected Linux and Android projects
        run: pnpm nx affected -t check test build --exclude='macos,tag:language:rust' --parallel=3

      # One cargo invocation over every affected Rust project, so shared
      # dependencies are compiled once per profile (scripts/ci-rust.ts).
      - name: Check and test affected Rust projects
        run: pnpm ci:rust

      - name: Build affected Rust applications
        run: pnpm nx affected -t build --exclude='*,!tag:language:rust'

  macos:
    runs-on: macos-26
    env:
      NX_CACHE_DIRECTORY: .nx/cache
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Nx task cache
        uses: actions/cache@v6.1.0
        with:
          path: .nx/cache
          key: nx-macos-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-macos-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock') }}-

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          cargo --version

      # Dependencies only (workspace crates and incremental state are left
      # out), keyed by Cargo.lock and the toolchain, saved from main only:
      # one entry per lockfile instead of one per commit and branch, so the
      # repository cache budget keeps the release jobs' caches.
      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: ci-macos
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve affected range
        uses: nrwl/nx-set-shas@v5.0.1

      - name: Check and test the affected macOS application
        run: pnpm nx affected -t check test --exclude='*,!macos'
